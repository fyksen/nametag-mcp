services:
  postgres:
    image: postgres:16-alpine
    container_name: nametag-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nametag}
      POSTGRES_USER: ${DB_USER:-nametag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nametag} -d ${DB_NAME:-nametag}"]
      interval: 5s
      timeout: 5s
      retries: 12

  nametag:
    image: ghcr.io/mattogodoy/nametag:0.63.0
    container_name: nametag-mcp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nametag}
      DB_USER: ${DB_USER:-nametag}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - photo_data:/app/data/photos

  mcp:
    profiles: ["mcp"]
    build: .
    container_name: nametag-mcp-server
    environment:
      NAMETAG_URL: ${MCP_NAMETAG_URL:-http://nametag:3000}
      NAMETAG_API_TOKEN: ${NAMETAG_API_TOKEN:-}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_TRUSTED_PROXY: "true"
    ports:
      - "127.0.0.1:8765:8765"
    stdin_open: true
    tty: false

volumes:
  postgres_data:
  photo_data:
